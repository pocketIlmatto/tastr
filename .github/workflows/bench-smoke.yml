name: bench-smoke
# Monthly benchmark smoke run on Modal (docs/ci.md#benchmark-smoke-run): main's engine on the first 100 tracks of
# GiantSteps Key and Beatport tempo, read from the R2 bucket. It runs main's code as a temporary Modal app
# (`modal run`), so the shared `tastr` app stays as deployed. .github/scripts/bench_smoke.py compares the scores
# with the last good run and with the scores the app quotes; a drop opens a `bench-drop` issue assigned to the
# owner, and the next good run closes it. About $0.15 of Modal compute a run.
# Needs the MODAL_TOKEN_ID and MODAL_TOKEN_SECRET repository secrets (the deploy workflow's), and the `tastr-r2`
# secret in the Modal workspace's main environment (docs/cloud.md).
on:
  schedule:
    - cron: "17 6 3 * *"  # the 3rd of each month, 06:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Tracks per dataset (the same number as earlier runs compares like with like)"
        default: "100"
      accept:
        description: "Accept these scores as the new baseline even if they dropped (after an intended change)"
        type: boolean
        default: false
concurrency:
  group: bench-smoke
  cancel-in-progress: false
permissions: {}
env:
  # dataset:bucket folder, space separated
  DATASETS: "giantsteps-key:giantsteps-key beatport-tempo:beatport-key"
  LIMIT: ${{ inputs.limit || '100' }}
  # The Cloudflare account id is not a secret (docs/hosting-map.md).
  TASTR_R2_ENDPOINT: https://1c793218966f05bb509e1e76f4ba0b67.r2.cloudflarestorage.com
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read  # to fetch the last good run's reports
      issues: write
    steps:
      - id: secrets
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ]; then
            echo "Not run: add the MODAL_TOKEN_ID and MODAL_TOKEN_SECRET repository secrets (docs/ci.md#benchmark-smoke-run)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Just the Modal client and the tastr source, which the Modal image uploads; the engine installs there.
      - run: pip install "modal>=1.0" && pip install --no-deps -e .
      - name: Fetch the last good run's reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bench-smoke.yml/runs?status=success&per_page=1" \
                  -q '.workflow_runs[0].id // empty' || true)
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" -n bench-smoke-reports -D previous \
              || echo "No reports from run $run (expired?); comparing with the quoted scores only."
          else
            echo "No earlier good run; comparing with the quoted scores only."
          fi
      - name: Run the benchmarks on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          mkdir -p reports
          for pair in $DATASETS; do
            dataset=${pair%%:*}; folder=${pair#*:}
            echo "::group::$dataset ($LIMIT tracks)"
            # A failed dataset leaves no report, which the comparison counts as a problem.
            modal run tastr/cloud/modal_app.py --kind bench --dataset "$dataset" --path "$folder" \
              --limit "$LIMIT" --out "reports/$dataset.json" || echo "::error::$dataset failed"
            echo "::endgroup::"
          done
      - id: compare
        run: |
          python3 .github/scripts/bench_smoke.py reports previous \
            --datasets "$(for p in $DATASETS; do printf '%s,' "${p%%:*}"; done)" | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-smoke-reports
          path: reports/*.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Open or close the bench-drop issue
        env:
          GH_TOKEN: ${{ github.token }}
          DROP: ${{ steps.compare.outputs.drop }}
          ACCEPT: ${{ inputs.accept && 'true' || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --label bench-drop --state open --json number --jq '.[0].number // empty')
          { echo "Run: $RUN_URL"; echo; cat report.md; } > body.md
          if [ "$DROP" = true ] && [ "$ACCEPT" = true ]; then
            echo "Accepted as the new baseline (started by hand with accept)." | tee -a "$GITHUB_STEP_SUMMARY"
            [ -n "$open" ] && gh issue comment "$open" --body "Accepted as the new baseline by hand: $RUN_URL" && gh issue close "$open"
            exit 0
          fi
          if [ "$DROP" = true ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file body.md
            else
              gh label create bench-drop --color B60205 --description "The monthly benchmark smoke run dropped (bench-smoke.yml)" --force
              gh issue create --label bench-drop --assignee "$GITHUB_REPOSITORY_OWNER" \
                --title "Benchmark smoke run dropped ($(date -u +%Y-%m-%d))" --body-file body.md
            fi
            # A failed run is never "the last good run", so the next one still compares with the scores before the drop.
            exit 1
          elif [ -n "$open" ]; then
            { echo "Scores are back within range, so this closes."; echo; cat body.md; } > close.md
            gh issue comment "$open" --body-file close.md
            gh issue close "$open"
          fi
