name: deploy-worker
# Builds, checks and deploys the Cloudflare Worker (worker/) that serves the hosted Tastr since the switch (TAS-51,
# docs/hosting-map.md). deploy.yml runs it after the Modal deploy on each merge to main that ships; by hand,
# Actions > deploy-worker > Run workflow deploys just the Worker.
# Needs the CLOUDFLARE_API_TOKEN secret: a Cloudflare API token from the "Edit Cloudflare Workers" template.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to deploy
        type: string
        required: true
concurrency:
  group: deploy-worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # build.py imports the app (for the prerendered page), so it needs the app's own packages.
      - run: pip install -e .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v7
      # The engine's WebAssembly build, for cards made in the browser (TASTR_BROWSER_ENGINE); the same Rust as
      # Modal's images. build.py puts it in public/engine/.
      - name: Build the engine for the browser
        working-directory: engine-rs
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.97.0 build --release --lib --target wasm32-unknown-unknown --locked
      # The same build, size check and local smoke test as CI (plus the engine file), then the real deploy.
      # TASTR_COMMIT, its subject and this run go into the Admin tab's deploy line. deploy.yml's scope step looks this step up by name in
      # earlier runs, so rename both together.
      - name: Deploy the Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHECK_ENGINE: "1"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./check.sh --serve
          uv run pywrangler deploy --var "TASTR_COMMIT:$(git rev-parse HEAD)" \
            --var "TASTR_COMMIT_SUBJECT:$(git log -1 --format=%s | tr -d '"')" --var "TASTR_DEPLOY_RUN:$RUN_URL"
