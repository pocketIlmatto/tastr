name: readme-shots
# Retakes the README screenshots (docs/images/) and opens a PR with them. Runs after a PR
# labeled `readme-shots` merges, or by hand from the Actions tab. Never on every push, so
# it only spends Actions minutes when the UI changed enough to matter (docs/ci.md).
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
concurrency:
  group: readme-shots
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  shots:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'readme-shots'))
    runs-on: ubuntu-latest
    # A normal run takes about 3 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install -e .
      # The Rust engine analyzes the tracks (the runner image has Rust).
      - run: cargo build --release --lib --locked
        working-directory: engine-rs
      - name: Playwright and Chromium
        run: |
          npm install -g playwright@1.63.0
          playwright install --with-deps chromium
      - run: python scripts/readme_shots.py
      - name: Open a PR if the images changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/images; then echo "Screenshots unchanged."; exit 0; fi
          branch="readme-shots/${{ github.run_id }}"
          from="${{ github.event.pull_request.number && format('after #{0}', github.event.pull_request.number) || 'by hand' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/images
          git commit -m "Retake README screenshots ($from)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Retake README screenshots ($from)" \
            --body "Generated by the readme-shots workflow (scripts/readme_shots.py). Check the images in the diff, then merge."
