name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The job always runs (so required checks never sit "pending"); only the
      # audio-analysis tests are skipped when a PR touches nothing but the web UI and docs.
      - id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "audio=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -Ev '^(tastr/web/|docs/)|\.md$' || true)
          if [ -n "$changed" ]; then echo "audio=true" >> "$GITHUB_OUTPUT"; else echo "audio=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install -e '.[dev]'
      - name: Tests
        if: steps.scope.outputs.audio == 'true'
        run: python -m pytest -q -n auto -m "not perf"
      - name: UI-only tests (audio analysis skipped)
        if: steps.scope.outputs.audio != 'true'
        run: python -m pytest -q -n auto -m "not audio"
      # Wall-clock budget, so it runs alone (parallel load would skew it) and only on main.
      - name: Performance budget
        if: github.event_name == 'push'
        run: python -m pytest -q -m perf
