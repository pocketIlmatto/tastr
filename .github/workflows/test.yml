name: tests
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same PR supersedes the run in progress, so cancel it. Runs on main are never
# cancelled: each merge keeps its own result.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    # A normal run takes about 3 minutes; without a limit a hung test bills for up to 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The job always runs (so required checks never sit "pending"). A PR or push to main that
      # touches only docs skips everything after this step; one that touches only the web UI and
      # docs skips the audio-analysis tests. A push whose previous commit is unknown tests it all.
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "${{ github.event.before }}" HEAD)
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "audio=true" >> "$GITHUB_OUTPUT"; echo "strudel=true" >> "$GITHUB_OUTPUT"; echo "rust=true" >> "$GITHUB_OUTPUT"; echo "js=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(echo "$files" | grep -Ev '^docs/|\.md$' | grep . || true)
          audio=$(echo "$code" | grep -Ev '^tastr/web/' | grep . || true)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "audio=$([ -n "$audio" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          strudel=$(echo "$code" | grep -E '^tastr/web/static/strudel\.js$|^tests/(test_strudel.*\.py|strudel-runtime/)' | grep . || true)
          echo "strudel=$([ -n "$strudel" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          rust=$(echo "$code" | grep -E '^engine-rs/|^tests/test_rust_(engine|switch)\.py$|^tastr/engine/(rust|browser_card)\.py$|^tastr/web/static/engine\.js$' | grep . || true)
          echo "rust=$([ -n "$rust" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          js=$(echo "$code" | grep -E '^tastr/web/static/.*\.js$|^eslint\.config\.mjs$' | grep . || true)
          echo "js=$([ -n "$js" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Docs-only change, tests skipped
        if: steps.scope.outputs.code != 'true'
        run: echo "Only docs/ and Markdown files changed; nothing to test."
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.code == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.scope.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - if: steps.scope.outputs.code == 'true'
        run: pip install -e '.[dev]'
      # Lint before the tests so a lint failure shows up in seconds. Config: [tool.ruff] in pyproject.toml.
      - name: Lint Python (ruff)
        if: steps.scope.outputs.code == 'true'
        run: ruff check --output-format github .
      # The web UI scripts, only when one of them (or the config) changes; the runner image already has Node.
      - name: Lint web UI (eslint)
        if: steps.scope.outputs.js == 'true'
        run: npx --yes eslint@10.12.0 tastr/web/static
      # Strudel itself (AGPL-3.0, test-only, never shipped) so tests/test_strudel_runtime.py can play the sketches;
      # only when the sketch generator or its tests change. Without it those tests skip.
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.strudel == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/strudel-runtime/package-lock.json
      - if: steps.scope.outputs.strudel == 'true'
        run: npm ci --ignore-scripts --prefix tests/strudel-runtime
      # The Rust engine (engine-rs/), native and WebAssembly, so tests/test_rust_engine.py can compare the two
      # builds and tests/test_rust_switch.py can use them; only when they or their Python side change. Without the builds that test skips. The runner image already
      # has Rust and Node.
      - uses: actions/cache@v4
        if: steps.scope.outputs.rust == 'true'
        with:
          path: |
            ~/.cargo/registry
            engine-rs/target
          key: rust-${{ hashFiles('engine-rs/Cargo.lock') }}
      - name: Build the Rust engine
        if: steps.scope.outputs.rust == 'true'
        working-directory: engine-rs
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --locked
          cargo build --release --locked --lib --target wasm32-unknown-unknown
          cargo clippy --release --locked --all-targets -- -D warnings
      - name: Tests
        if: steps.scope.outputs.audio == 'true'
        run: python -m pytest -q -n auto -m "not perf"
      - name: UI-only tests (audio analysis skipped)
        if: steps.scope.outputs.code == 'true' && steps.scope.outputs.audio != 'true'
        run: python -m pytest -q -n auto -m "not audio"
      # Wall-clock budget, so it runs alone (parallel load would skew it) and only on main.
      - name: Performance budget
        if: github.event_name == 'push' && steps.scope.outputs.audio == 'true'
        run: python -m pytest -q -m perf
