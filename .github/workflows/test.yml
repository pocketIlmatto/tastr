name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The job always runs (so required checks never sit "pending"). A PR that touches only docs
      # skips everything after this step; one that touches only the web UI and docs skips the
      # audio-analysis tests.
      - id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "audio=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          code=$(echo "$files" | grep -Ev '^docs/|\.md$' | grep . || true)
          audio=$(echo "$code" | grep -Ev '^tastr/web/' | grep . || true)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "audio=$([ -n "$audio" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Docs-only change, tests skipped
        if: steps.scope.outputs.code != 'true'
        run: echo "Only docs/ and Markdown files changed; nothing to test."
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.code == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.scope.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - if: steps.scope.outputs.code == 'true'
        run: pip install -e '.[dev]'
      - name: Tests
        if: steps.scope.outputs.audio == 'true'
        run: python -m pytest -q -n auto -m "not perf"
      - name: UI-only tests (audio analysis skipped)
        if: steps.scope.outputs.code == 'true' && steps.scope.outputs.audio != 'true'
        run: python -m pytest -q -n auto -m "not audio"
      # Wall-clock budget, so it runs alone (parallel load would skew it) and only on main.
      - name: Performance budget
        if: github.event_name == 'push'
        run: python -m pytest -q -m perf
