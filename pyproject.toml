[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tastr"
version = "0.1.0"
description = "Drop in audio, get a track card: BPM, key, energy, sections, vibe tags and Ableton ideas."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
links = ["yt-dlp"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tastr = "tastr.cli:main"

[tool.setuptools.packages.find]
include = ["tastr*"]

[tool.setuptools.package-data]
tastr = ["web/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
