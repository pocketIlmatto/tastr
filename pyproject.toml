[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tastr"
version = "0.1.0"
description = "Drop in audio, get a track card: BPM, key, energy, sections, vibe tags and Ableton ideas."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# The Rust engine (engine-rs/, built separately) makes the cards, so the base install has no DSP libraries: the
# hosted web server's image (Dockerfile) is this plus `hosted` and `cloud`.
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "mutagen>=1.47",
]

[project.optional-dependencies]
# The Python reference engine the benchmarks score (tastr/engine/stages/), decoding the formats the Rust engine
# can't read (Opus), and the audio the drum model and stem separation read. The Modal images install these
# with the pins in tastr/cloud/modal_web.py.
engine = ["scipy>=1.10", "librosa>=0.10"]
links = ["yt-dlp"]
# Stem separation (`tastr stems`, "Separate stems" in the UI). Pulls in PyTorch, about 2 GB.
stems = ["demucs>=4.0.1", "tastr[engine]"]
# The pretrained drum model for the kick, hat, tom and cymbal lanes (docs/drums.md). PyTorch, shared with
# `stems`; the weights (CC BY-NC-SA 4.0, about 5 MB) download on first use.
drums = ["torch>=2.1", "tastr[engine]"]
# Hosted mode: checks Cloudflare Access logins (docs/hosting.md), and keeps uploads and stems in an
# S3-compatible bucket such as R2 when TASTR_AUDIO_BUCKET is set (tastr/blobs.py).
hosted = ["pyjwt[crypto]>=2.8", "boto3>=1.34"]
# Benchmarks and stem separation on Modal (docs/cloud.md).
cloud = ["modal>=1.0"]
# ruff is pinned so a new release cannot turn CI red on its own; bump it on purpose.
dev = ["tastr[engine]", "pytest>=8", "pytest-xdist>=3.5", "httpx>=0.27", "pyjwt[crypto]>=2.8", "ruff==0.17.3",
       "boto3>=1.34", "moto[s3]>=5"]

[project.scripts]
tastr = "tastr.cli:main"

[tool.setuptools.packages.find]
include = ["tastr*"]

[tool.setuptools.package-data]
tastr = ["web/*", "web/static/*", "engine/*.json"]

# Lint (CI runs `ruff check .`). A small rule set that catches real mistakes: pyflakes (unused imports and
# names, undefined names), syntax errors, and bugbear. B008 is off because FastAPI's `Depends()`/`File()`
# defaults are the intended style; B905 is off because most zips here pair arrays of equal length by design.
[tool.ruff]
line-length = 120
extend-exclude = ["tests/strudel-runtime"]

[tool.ruff.lint]
select = ["F", "E9", "B", "C901"]
ignore = ["B008", "B905"]

[tool.ruff.lint.mccabe]
max-complexity = 20  # radon's D starts at 21 (TAS-41)

[tool.ruff.lint.per-file-ignores]
# mccabe counts the route closures into the function that defines them; each route on its own is far below 20.
"tastr/web/routes/*.py" = ["C901"]
"tastr/web/server.py" = ["C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "audio: runs real audio analysis (slow); skipped on UI-only PRs",
    "rust: analyzes through the app, so needs the Rust engine library (counts as audio; skipped without it)",
    "perf: wall-clock budget test; run serially on main, not under xdist",
]
