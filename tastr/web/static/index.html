<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tastr</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Tastr</h1>
  <nav>
    <button data-view="library" class="active">Library</button>
    <button data-view="explore">Explore</button>
  </nav>
</header>
<main>
  <section id="view-library">
    <div id="drop" tabindex="0">
      <p><strong>Drop audio files or folders here</strong> or <label class="link">browse files<input id="file-input" type="file" multiple accept="audio/*,.m4a,.aac,.flac,.ogg,.mp3,.wav" hidden></label> or <label class="link">a folder<input id="folder-input" type="file" webkitdirectory multiple hidden></label></p>
      <form id="url-form"><input id="url-input" type="url" placeholder="…or paste a track / playlist link"><button>Analyze</button></form>
      <p id="status" role="status"></p>
    </div>
    <div class="split">
      <aside id="lib">
        <div id="lib-tools">
          <input id="lib-q" type="search" placeholder="Search title or artist" aria-label="Search tracks">
          <div class="lib-row">
            <label>Sort <select id="lib-sort" aria-label="Sort tracks">
              <option value="new">Newest</option><option value="title">Title A–Z</option><option value="bpm">BPM, slow to fast</option>
              <option value="bpmd">BPM, fast to slow</option><option value="key">Key</option><option value="energy">Energy, high to low</option><option value="len">Length, long to short</option>
            </select></label>
            <button type="button" id="lib-fbtn" aria-expanded="false" aria-controls="lib-filters">Filters</button>
          </div>
          <div id="lib-filters" hidden>
            <label>Vibe <select id="lib-vibe"></select></label>
            <label>Key <select id="lib-key"></select></label>
            <label class="lib-bpm">BPM <input id="lib-bmin" type="number" min="0" max="300" placeholder="min" aria-label="Minimum BPM"> – <input id="lib-bmax" type="number" min="0" max="300" placeholder="max" aria-label="Maximum BPM"></label>
          </div>
          <div class="lib-count muted"><span id="lib-n" role="status" aria-live="polite"></span> <button type="button" id="lib-clear" class="linklike" hidden>Clear filters</button></div>
        </div>
        <ul id="track-list" aria-label="Tracks"></ul>
      </aside>
      <article id="card"><p class="muted">Select a track.</p></article>
    </div>
  </section>
  <section id="view-explore" hidden>
    <div class="filters">
      <label>Tag <select id="f-tag"><option value="">any</option></select></label>
      <label>BPM <input id="f-min" type="number" placeholder="min"> – <input id="f-max" type="number" placeholder="max"></label>
    </div>
    <div id="scatter-wrap"></div>
    <h2>SQL</h2>
    <div id="examples"></div>
    <textarea id="sql" rows="4" spellcheck="false">SELECT title, bpm, camelot, energy FROM tracks ORDER BY bpm</textarea>
    <button id="run-sql">Run</button>
    <p id="sql-error" class="error"></p>
    <div class="table-wrap"><table id="sql-result"></table></div>
  </section>
</main>
<script src="/static/strudel.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
